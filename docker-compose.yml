services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - MOCK_LLM=true
      - DATABASE_URL=sqlite+aiosqlite:///./auracfo.db
      - HMAC_SECRET_KEY=auracfo-super-secret-hmac-salt-key-2026
      - HOST=0.0.0.0
      - PORT=8000
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
    volumes:
      - ./backend/data:/app/data
      - backend-db:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/dashboard/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-db:
